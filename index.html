<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title data-lang="title">각종 테스트</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<div class="logo" data-lang="title">각종 테스트</div>

<nav>
<ul>
<li><a href="#home" class="nav-link" data-page="home">홈</a></li>
<li><a href="#love" class="nav-link" data-page="love">연애스킬</a></li>
</ul>
</nav>

<div class="top-controls">
<select id="language-select">
<option value="ko">한국어</option>
<option value="en">English</option>
</select>

<label class="theme-switch">
<input type="checkbox" id="checkbox">
<span class="slider"></span>
</label>
</div>
</header>

<main>

<section id="home" class="page active">
<h1 class="center-title">테스트 선택</h1>

<div class="grid-container center">
<div class="test-card nav-link" data-page="love">
<h3>연애스킬 테스트</h3>
</div>
</div>
</section>

<section id="love" class="page">
<div class="container center">

<h2>연애스킬 테스트</h2>

<div id="question-box"></div>
<div id="answers"></div>

<div id="result" hidden>
<h3 id="result-title"></h3>
<div class="gauge">
<div id="gauge-bar"></div>
</div>
</div>

<button id="start-test">테스트 시작</button>

<div id="disqus_thread"></div>

</div>
</section>

</main>

<footer class="center">
<h3>제휴 문의</h3>
<form action="https://formspree.io/f/xaqdnqko" method="POST">
<input type="email" name="email" placeholder="이메일" required>
<textarea name="message" placeholder="내용"></textarea>
<button type="submit">보내기</button>
</form>
</footer>

<script src="main.js"></script>

<script>
(function(){
var d=document,s=d.createElement('script');
s.src='https://sgi217-2.disqus.com/embed.js';
(d.head||d.body).appendChild(s);
})();
</script>

</body>
</html>
