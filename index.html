<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테스트 플랫폼</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<div class="menu-center">
<button class="menu-btn" data-page="home">홈</button>
<button class="menu-btn" data-page="testSelect">테스트 선택</button>
</div>

<div class="menu-right">
<select id="language-select">
<option value="ko">한국어</option>
<option value="en">English</option>
</select>

<label class="switch">
<input type="checkbox" id="theme-toggle">
<span class="slider"></span>
</label>
</div>

</header>

<main>

<section id="home" class="page active">
<h1>심리 테스트 플랫폼</h1>
<p>테스트 선택을 눌러 시작하세요</p>
</section>

<section id="testSelect" class="page">

<h2>테스트 목록</h2>

<div class="test-list">
<button class="test-btn" id="loveSkillBtn">연애스킬 테스트</button>
</div>

</section>

<section id="loveSkill" class="page">

<h2 id="progress">1/12</h2>

<div id="questionBox"></div>

<div class="answer-area">
<button id="yesBtn">YES</button>
<button id="noBtn">NO</button>
</div>

<div class="gauge">
<div id="gaugeFill"></div>
</div>

</section>

</main>

<footer>

<div class="contact">
<h3>제휴 문의</h3>

<form action="https://formspree.io/f/xaqdnqko" method="POST">

<input type="email" name="email" placeholder="이메일" required>

<textarea name="message" placeholder="내용 입력" required></textarea>

<button type="submit">보내기</button>

</form>

</div>

</footer>

<script src="main.js"></script>
</body>
</html>
