<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유빈 테스트</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<div class="logo">유빈</div>

<nav class="menu">
<button onclick="showPage('home-page')">홈</button>
<button onclick="showPage('love-skill-page')">연애테스트</button>
<button onclick="showPage('admin-page')">관리자</button>
</nav>

<div class="right-controls">
<select id="language-select">
<option value="ko">한국어</option>
<option value="en">English</option>
</select>

<label class="switch">
<input type="checkbox" id="themeToggle">
<span class="slider"></span>
</label>
</div>
</header>

<main>

<section id="home-page" class="page active">
<h1>테스트 선택</h1>

<div id="testList"></div>

<div class="ads">광고 위치 (에드센스)</div>

</section>

<section id="love-skill-page" class="page">

<h2>연애스킬 테스트</h2>

<div id="progress"></div>

<div id="questionBox"></div>
<div id="answers"></div>

<div id="gaugeContainer">
<div id="gauge"></div>
</div>

</section>

<section id="admin-page" class="page">
<h2>테스트 관리자</h2>
<textarea id="jsonInput" placeholder="테스트 JSON 입력"></textarea>
<button onclick="addTest()">테스트 추가</button>
</section>

</main>

<script src="main.js"></script>
</body>
</html>
