<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유빈 테스트월드</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<div class="logo">유빈</div>

<div class="menu-center">
<button onclick="showPage('home')">홈</button>
<button onclick="showPage('list')">테스트목록</button>
</div>

<div class="menu-right">
<label class="switch">
<input type="checkbox" id="themeToggle">
<span class="slider"></span>
</label>
</div>
</header>

<main>

<div id="home" class="page active">
<h1>테스트 선택</h1>
<button class="bigBtn" onclick="showPage('list')">테스트 목록 보기</button>
</div>

<div id="list" class="page">
<h2>테스트 목록</h2>
<button class="testBtn" onclick="showPage('love')">연애스킬 테스트</button>
</div>

<div id="love" class="page">
<h2>연애스킬 테스트</h2>

<div id="startBox">
<button class="bigBtn" onclick="startTest()">테스트 시작</button>
</div>

<div id="quizBox" style="display:none">
<div id="progress"></div>
<div id="question"></div>
<button class="answerBtn" onclick="answer(true)">YES</button>
<button class="answerBtn" onclick="answer(false)">NO</button>
</div>

<div id="resultBox" style="display:none">
<h3>연애력 게이지</h3>
<div class="gauge">
<div id="gaugeFill"></div>
</div>
</div>

</div>

</main>

<footer>
<h3>제휴 문의</h3>
<form action="https://formspree.io/f/xaqdnqko" method="POST">
<input type="email" name="email" placeholder="이메일" required>
<button type="submit">보내기</button>
</form>
</footer>

<script src="main.js"></script>
</body>
</html>
