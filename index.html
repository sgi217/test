<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>유빈 테스트월드</title>

<style>
body{
font-family:sans-serif;
margin:0;
background:#fafafa;
text-align:center;
}
.dark{
background:#1e1e1e;
color:#ddd;
}
header{
display:flex;
justify-content:space-between;
padding:15px;
background:linear-gradient(90deg,#ff9a9e,#fad0c4);
}
.menu{
display:flex;
gap:10px;
justify-content:center;
}
button{
padding:12px 20px;
border-radius:10px;
border:none;
cursor:pointer;
font-size:16px;
}
.big{font-size:20px;padding:18px 30px}
.center{max-width:700px;margin:auto}
.gauge{
height:30px;
background:#ddd;
border-radius:20px;
overflow:hidden;
}
.bar{
height:100%;
background:linear-gradient(90deg,#ffc0cb,#ff0000);
text-align:center;
color:white;
font-weight:bold;
}
input{padding:12px;width:200px}
</style>
</head>

<body>

<header>
<div>유빈</div>

<div class="menu">
<button onclick="showHome()">홈</button>
<button onclick="showTests()">연애테스트</button>
</div>

<div>
<button onclick="login()">로그인</button>
<button onclick="toggleTheme()">🌙</button>
</div>
</header>

<div class="center" id="app"></div>

<script>

let user=localStorage.getItem("user")||"게스트"

function login(){
let name=prompt("닉네임 입력")
if(name){
localStorage.setItem("user",name)
user=name
alert("로그인 완료")
}
}

function toggleTheme(){
document.body.classList.toggle("dark")
}

const tests=[
{
title:"연애스킬 테스트",
questions:[
{q:"호감 가는 사람이 있으면 바로 다가간다",yes:10,no:3},
{q:"이상형은 영화속에 있다",yes:8,no:4},
{q:"연애는 안정감이 중요",yes:3,no:9},
{q:"조건 먼저 본다",yes:2,no:8},
{q:"하루종일 같이있으면 부담",yes:4,no:7},
{q:"감정기복 심함",yes:6,no:5},
{q:"누가잘못했는지 따짐",yes:3,no:8},
{q:"감정 참는편",yes:5,no:6},
{q:"약속늦으면 화남",yes:4,no:6},
{q:"데이트 즉흥",yes:9,no:5},
{q:"순간즐김",yes:10,no:3},
{q:"연애사 공유",yes:8,no:4}
]
}
]

function showHome(){
app.innerHTML=`
<h1>테스트 플랫폼</h1>
<button class="big" onclick="showTests()">테스트 선택</button>
`
}

function showTests(){
let html="<h2>테스트목록</h2>"
tests.forEach((t,i)=>{
html+=`<button class="big" onclick="startTest(${i})">${t.title}</button><br>`
})
app.innerHTML=html
}

function startTest(i){
let t=tests[i]
let idx=0
let score=0

function render(){
if(idx>=t.questions.length){
let percent=Math.round(score/120*100)
saveRanking(percent)
app.innerHTML=`
<h2>결과</h2>
<div class="gauge">
<div class="bar" style="width:${percent}%">${percent}%</div>
</div>

<h3>랭킹</h3>
${loadRanking()}

<!-- ADSENSE 결과광고 위치 -->

<button onclick="showHome()">홈</button>
`
return
}

let q=t.questions[idx]
app.innerHTML=`
<h3>${idx+1}/${t.questions.length}</h3>
<h2>${q.q}</h2>

<button class="big" onclick="ans(${q.yes})">YES</button>
<button class="big" onclick="ans(${q.no})">NO</button>

<!-- ADSENSE 중간광고 위치 -->
`
}

window.ans=(s)=>{
score+=s
idx++
render()
}

render()
}

function saveRanking(score){
let arr=JSON.parse(localStorage.getItem("rank")||"[]")
arr.push({name:user,score})
arr.sort((a,b)=>b.score-a.score)
arr=arr.slice(0,5)
localStorage.setItem("rank",JSON.stringify(arr))
}

function loadRanking(){
let arr=JSON.parse(localStorage.getItem("rank")||"[]")
return arr.map(r=>`<div>${r.name} - ${r.score}%</div>`).join("")
}

showHome()

</script>

</body>
</html>
