<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-lang="title">연애 테스트</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>

<div class="nav-center">
<button class="menu-btn" data-page="home">홈</button>
<button class="menu-btn" data-page="love">연애스킬</button>
</div>

<div class="top-right">

<select id="lang">
<option value="ko">한국어</option>
<option value="en">English</option>
</select>

<label class="switch">
<input type="checkbox" id="themeToggle">
<span class="slider"></span>
</label>

</div>

</header>

<main>

<section id="home" class="page active center">
<h1>연애스킬 테스트 플랫폼</h1>
<button id="goTest" class="big-btn">테스트 선택</button>
</section>

<section id="love" class="page center">

<h2>연애스킬 테스트</h2>

<div id="startArea">
<button id="startTest" class="big-btn">테스트 시작</button>
</div>

<div id="testArea" hidden>

<div id="progress"></div>
<div id="question" class="question"></div>

<div class="answerBox">
<button id="yesBtn" class="ans">YES</button>
<button id="noBtn" class="ans">NO</button>
</div>

</div>

<div id="resultArea" hidden>

<h2>연애 점수</h2>

<div class="gaugeWrap">
<div id="gauge"></div>
</div>

<p id="scoreText"></p>

</div>

</section>

</main>

<footer class="center">

<form action="https://formspree.io/f/xaqdnqko" method="POST" class="contact">

<input name="email" placeholder="이메일" required>
<textarea name="message" placeholder="문의 내용" required></textarea>
<button type="submit">보내기</button>

</form>

</footer>

<script src="main.js"></script>
</body>
</html>
