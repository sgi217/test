<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title data-lang="pageTitle">각종 테스트</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="logo">각종 테스트</div>

<nav>
<a class="nav-link" data-page="home-page">홈</a>
<a class="nav-link" data-page="mbti-page">MBTI</a>
<a class="nav-link" data-page="love-page">연애스킬</a>
<a class="nav-link" data-page="loner-page">찐따력</a>
<a class="nav-link" data-page="fortune-page">운세</a>
</nav>

<div class="controls">
<select id="language-select">
<option value="ko">한국어</option>
<option value="en">English</option>
</select>

<input type="checkbox" id="checkbox">
</div>

</header>

<main>

<section id="home-page" class="page-content">
<h1>테스트 홈</h1>
</section>

<section id="mbti-page" class="page-content hidden">
<h1>MBTI 테스트 준비중</h1>
<div id="disqus_mbti"></div>
</section>

<section id="love-page" class="page-content hidden">
<h1>연애스킬 테스트 준비중</h1>
<div id="disqus_love"></div>
</section>

<section id="loner-page" class="page-content hidden">
<h1>찐따력 테스트 준비중</h1>
<div id="disqus_loner"></div>
</section>

<section id="fortune-page" class="page-content hidden">
<h1>오늘의 운세</h1>
<button id="fortuneBtn">운세보기</button>
<p id="fortuneText"></p>
<div id="disqus_fortune"></div>
</section>

</main>

<footer>
<h3>제휴 문의</h3>
<form action="https://formspree.io/f/xaqdnqko" method="POST">
<input name="email" required placeholder="이메일">
<textarea name="message" required></textarea>
<button>보내기</button>
</form>
</footer>

<script src="main.js"></script>
</body>
</html>
