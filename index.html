<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-lang="pageTitle">각종 테스트</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<div class="logo" data-lang="pageTitle">각종 테스트</div>

<nav>
<ul>
<li><a href="#home" class="nav-link" data-page="home-page">홈</a></li>
<li><a href="#love-skill" class="nav-link" data-page="love-skill-page">연애스킬</a></li>
</ul>
</nav>

<div class="top-controls">
<select id="language-select">
<option value="ko">한국어</option>
<option value="en">English</option>
</select>

<label class="theme-switch">
<input type="checkbox" id="checkbox">
<span class="slider"></span>
</label>
</div>

</header>

<main>

<div id="home-page" class="page-content">
<div class="center-box">

<h1>테스트 선택</h1>

<a href="#love-skill" class="big-test-btn nav-link" data-page="love-skill-page">
연애스킬 테스트 시작
</a>

</div>
</div>

<div id="love-skill-page" class="page-content" hidden>

<div class="test-container">

<button id="start-love">테스트 시작</button>

<div id="question-area" hidden>
<h2 id="question"></h2>
<button id="yesBtn">YES</button>
<button id="noBtn">NO</button>
</div>

<div id="result-area" hidden>
<h2 id="result-title"></h2>
<p id="result-desc"></p>
</div>

</div>

</div>

</main>

<footer>
<div class="footer-contact">
<h4>제휴 문의</h4>
<form action="https://formspree.io/f/xaqdnqko" method="POST">
<input type="email" name="email" required>
<textarea name="message" required></textarea>
<button type="submit">문의 제출</button>
</form>
</div>
</footer>

<script src="main.js"></script>
</body>
</html>
