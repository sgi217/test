<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-lang="siteTitle">각종 테스트</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="logo" data-lang="siteTitle">각종 테스트</div>

<nav>
<ul>
<li><a href="#home" class="nav-link" data-page="home-page" data-lang="navHome">홈</a></li>
<li><a href="#love" class="nav-link" data-page="love-page" data-lang="navLove">연애스킬</a></li>
</ul>
</nav>

<div class="top-controls">
<select id="language-select">
<option value="ko">한국어</option>
<option value="en">English</option>
</select>

<label class="theme-switch">
<input type="checkbox" id="checkbox">
<span class="slider"></span>
</label>
</div>

</header>

<main>

<div id="home-page" class="page-content">
<h1 data-lang="mainTitle">테스트 선택</h1>
</div>

<div id="love-page" class="page-content" hidden>

<div class="container">
<h1 data-lang="navLove">연애스킬 테스트</h1>

<div id="question-area">
<h2 id="question-text"></h2>
<button id="yes-btn">YES</button>
<button id="no-btn">NO</button>
</div>

<div id="result-area" hidden>
<h2 id="result-title"></h2>
<div class="gauge">
<div id="gauge-bar"></div>
</div>
<p id="result-desc"></p>
</div>

</div>

<div id="disqus_thread"></div>

</div>

</main>

<footer>

<div class="footer-contact">
<h4>제휴 문의</h4>
<form action="https://formspree.io/f/xaqdnqko" method="POST">
<input type="email" name="email" required>
<textarea name="message"></textarea>
<button type="submit">문의</button>
</form>
</div>

</footer>

<script src="main.js"></script>
</body>
</html>
