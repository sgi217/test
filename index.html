<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-lang="pageTitle">각종 테스트</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<div class="logo" data-lang="mainSiteTitle">각종 테스트</div>

<nav>
<ul>
<li><a href="#home" class="nav-link" data-page="home-page" data-lang="navHome">홈</a></li>
<li><a href="#mbti" class="nav-link" data-page="mbti-page" data-lang="navMbti">MBTI</a></li>
<li><a href="#love-skill" class="nav-link" data-page="love-skill-page" data-lang="navLoveSkill">연애스킬</a></li>
<li><a href="#loner-power" class="nav-link" data-page="loner-power-page" data-lang="navLonerPower">찐따력</a></li>
<li><a href="#fortune" class="nav-link" data-page="fortune-page" data-lang="navFortune">운세</a></li>
</ul>
</nav>

<div class="header-right">
<select id="language-select">
<option value="ko">한국어</option>
<option value="en">English</option>
</select>

<label class="theme-switch">
<input type="checkbox" id="checkbox"/>
<span class="slider"></span>
</label>
</div>
</header>

<main>

<div id="home-page" class="page-content">
<h1>테스트를 선택하세요</h1>
</div>

<div id="mbti-page" class="page-content" hidden>
<div class="container">
<h1>MBTI 테스트</h1>
<button onclick="startTest('mbti')">테스트 시작</button>
<div id="test-area-mbti"></div>
</div>
<div id="disqus_thread"></div>
</div>

<div id="love-skill-page" class="page-content" hidden>
<div class="container">
<h1>연애스킬 테스트</h1>
<button onclick="startTest('loveSkill')">테스트 시작</button>
<div id="test-area-loveSkill"></div>
</div>
<div id="disqus_thread"></div>
</div>

<div id="loner-power-page" class="page-content" hidden>
<div class="container">
<h1>찐따력 테스트</h1>
<button onclick="startTest('lonerPower')">테스트 시작</button>
<div id="test-area-lonerPower"></div>
</div>
<div id="disqus_thread"></div>
</div>

<div id="fortune-page" class="page-content" hidden>
<h1>오늘의 운세</h1>
<p id="fortune-result"></p>
<button onclick="generateFortune()">운세 보기</button>
<div id="disqus_thread"></div>
</div>

</main>

<footer>
<form action="https://formspree.io/f/xaqdnqko" method="POST">
<input type="email" name="email" required placeholder="email">
<textarea name="message" required></textarea>
<button type="submit">문의</button>
</form>
</footer>

<script src="main.js"></script>
</body>
</html>
