<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>테스트 관리자</title>
</head>
<body>

<h1>테스트 제작기</h1>

<input id="name" placeholder="테스트 이름">

<textarea id="json" rows="15" cols="50"
placeholder="질문 JSON 붙여넣기"></textarea>

<button onclick="make()">JSON 생성</button>

<pre id="output"></pre>

<script>
function make(){
const name=document.getElementById("name").value;
const q=JSON.parse(document.getElementById("json").value);

const data={
name:name,
id:name.replace(/\s/g,""),
questions:q
};

document.getElementById("output").textContent=
JSON.stringify(data,null,2);
}
</script>

</body>
</html>
